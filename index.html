<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORA - Realtime Audio Monitor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #2a2a2a; padding: 20px; border-radius: 8px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; border: none; }
        #btn-start { background-color: #00e676; color: #000; }
        select { padding: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        #status { font-weight: bold; margin-bottom: 15px; }
        #transcript-box { background: #121212; padding: 15px; border-radius: 4px; height: 300px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h2>MORA - Realtime Audio Monitor</h2>
    
    <div class="controls">
        <button id="btn-start" onclick="toggleMonitoring()">🟢 Start Monitoring</button>
        <label for="lang-select">Idioma:</label>
        <select id="lang-select" onchange="handleLanguageChange()">
            <option value="en" selected>English</option>
            <option value="es">Español</option>
        </select>
    </div>

    <div id="status">⏸️ Monitoreo pausado.</div>
    <div id="transcript-box"></div>
</div>

<script>
    var socket = null;
    var audioContext = null;
    var processorNode = null;
    var isListening = false;
    var rawTranscriptHistory = "";

    function normalize(text) {
        return text.toLowerCase().trim();
    }

    function checkOpeningPhrase(text) {
        var englishPhrases = ["thank you for calling", "thanks for calling", "my name is"];
        var spanishPhrases = ["gracias por llamar", "mi nombre es", "bienvenido a"];
        var allPhrases = englishPhrases.concat(spanishPhrases);
        return allPhrases.some(phrase => text.includes(phrase));
    }

    function resetTranscript() {
        rawTranscriptHistory = "";
        document.getElementById("transcript-box").innerHTML = "";
    }

    function handleLanguageChange() {
        if (isListening) {
            stopMonitoring();
            startMonitoring();
        }
    }

    function toggleMonitoring() {
        if (isListening) {
            stopMonitoring();
        } else {
            startMonitoring();
        }
    }

    function convertFloat32ToInt16(buffer) {
        let l = buffer.length;
        let buf = new Int16Array(l);
        while (l--) {
            let s = Math.max(-1, Math.min(1, buffer[l]));
            buf[l] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return buf.buffer;
    }

    function analyzeRealtime(history) {
        document.getElementById("transcript-box").innerHTML = history;
        var box = document.getElementById("transcript-box");
        box.scrollTop = box.scrollHeight;
    }

    async function startMonitoring() {
        var btn = document.getElementById("btn-start");
        var status = document.getElementById("status");
        var selectedLang = document.getElementById("lang-select").value;

        try {
            status.innerText = "⏳ 1/2: Selecciona pantalla/pestaña y activa 'Compartir audio del sistema'...";
            status.style.color = "#ffd700";

            const systemStream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });

            const systemAudioTrack = systemStream.getAudioTracks()[0];
            if (!systemAudioTrack) {
                alert("⚠️ Importante: Debes marcar la casilla 'Compartir audio del sistema'.");
                systemStream.getTracks().forEach(t => t.stop());
                status.innerText = "⏸️ Monitoreo pausado.";
                return;
            }

            status.innerText = "⏳ 2/2: Solicitando acceso al micrófono...";

            const micStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });

            audioContext = new (window.AudioContext || window.webkitAudioContext)();

            const merger = audioContext.createChannelMerger(2);
            const micSource = audioContext.createMediaStreamSource(micStream);
            const systemSource = audioContext.createMediaStreamSource(systemStream);

            micSource.connect(merger, 0, 0);       // Canal 0: Agente
            systemSource.connect(merger, 0, 1);    // Canal 1: Cliente

            // Se envía la IP local junto al parámetro de idioma seleccionado (?language=es o ?language=en)
            var wsUrl = "ws://10.80.66.56:8080?language=" + selectedLang;
            socket = new WebSocket(wsUrl);

            socket.onopen = function() {
                status.innerText = "🟢 Monitoreo Activo (" + selectedLang.toUpperCase() + ")...";
                status.style.color = "#00e676";
                btn.innerText = "🔴 Detener Monitoreo";
                isListening = true;

                processorNode = audioContext.createScriptProcessor(4096, 2, 2);
                merger.connect(processorNode);
                processorNode.connect(audioContext.destination);

                processorNode.onaudioprocess = function(e) {
                    if (!isListening || socket.readyState !== 1) return;

                    const left = e.inputBuffer.getChannelData(0);
                    const right = e.inputBuffer.getChannelData(1);

                    const interleaved = new Float32Array(left.length + right.length);
                    for (let i = 0; i < left.length; i++) {
                        interleaved[i * 2] = left[i];
                        interleaved[i * 2 + 1] = right[i];
                    }

                    const pcmBuffer = convertFloat32ToInt16(interleaved);
                    socket.send(pcmBuffer);
                };
            };

            socket.onmessage = function(msg) {
                var data = JSON.parse(msg.data);
                if (data.channel && data.channel.alternatives && data.channel.alternatives[0]) {
                    var transcript = data.channel.alternatives[0].transcript;
                    if (transcript && transcript.trim().length > 0) {
                        var channelIdx = (data.channel_index && data.channel_index.length > 0) ? data.channel_index[0] : 0;
                        var speaker = (channelIdx === 0) ? "Agent" : "Borrower";
                        
                        var normFragment = normalize(transcript);

                        if (speaker === "Agent" && checkOpeningPhrase(normFragment)) {
                            resetTranscript();
                        }

                        rawTranscriptHistory += "[" + speaker + "]: " + transcript + "<br>";
                        analyzeRealtime(rawTranscriptHistory);
                    }
                }
            };

            socket.onerror = function(err) {
                console.error("Error en WebSocket:", err);
                stopMonitoring();
            };

            socket.onclose = function() {
                if (isListening) stopMonitoring();
            };

        } catch (err) {
            console.error("Error al iniciar monitoreo:", err);
            status.innerText = "❌ Error al acceder a las fuentes de audio.";
            status.style.color = "#ff4d4d";
            isListening = false;
        }
    }

    function stopMonitoring() {
        isListening = false;
        if (processorNode) {
            processorNode.disconnect();
            processorNode = null;
        }
        if (audioContext) {
            audioContext.close();
            audioContext = null;
        }
        if (socket) {
            socket.close();
            socket = null;
        }
        var btn = document.getElementById("btn-start");
        var status = document.getElementById("status");
        btn.innerText = "🟢 Start Monitoring";
        status.innerText = "⏸️ Monitoreo pausado.";
        status.style.color = "#fff";
    }
</script>

</body>
</html>
