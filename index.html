function normalize(text) {
    if (!text) return "";
    return text.toLowerCase()
        .replace(/[áàä]/g, "a")
        .replace(/[éèë]/g, "e")
        .replace(/[íìï]/g, "i")
        .replace(/[óòö]/g, "o")
        .replace(/[úùü]/g, "u")
        .replace(/ñ/g, "n")
        .replace(/['’]/g, "'")
        .replace(/[^a-z0-9' ]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function maskSensitiveData(text) {
    if (!text) return "";
    return text
        .replace(/\b\d{3}[-\s]?\d{2}[-\s]?\d{4}\b/g, '***-**-****')
        .replace(/\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{1,7}\b/g, '****-****-****-****')
        .replace(/(\$|usd\s?)\d+(?:,\d{3})*(?:\.\d{1,2})?/gi, '***')
        .replace(/(?:\+?1[-\s]?)?\(?\d{3}\)?[-\s]?\d{3}[-\s]?\d{4}/g, '***-***-****')
        .replace(/\b\d{4,}\b/g, '****')
        .replace(/\b\d{1,3}\b/g, '*')
        .replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand|million|billion|trillion|dollar|dollars|cent|cents)\b/gi, '*')
        .replace(/\b(cero|uno|una|unos|unas|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|diecisiete|dieciocho|diecinueve|veinte|veintiuno|veintidos|veintidós|veintitres|veintitrés|veinticinco|veintiseis|veintisiete|veintiocho|veintinueve|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|ciento|cientos|cien|quinientos|seiscientos|setecientos|ochocientos|novecientos|mil|millon|millones|dolar|dolares|centavo|centavos)\b/gi, '*');
}

function checkOpeningPhrase(textNormalized) {
    for (var i = 0; i < openingPhrases.length; i++) {
        if (textNormalized.indexOf(openingPhrases[i]) !== -1) {
            return true;
        }
    }
    return false;
}

function checkEmpathy(textNormalized) {
    for (var i = 0; i < empathyPhrases.length; i++) {
        var termNorm = normalize(empathyPhrases[i]);
        if (textNormalized.indexOf(termNorm) !== -1) return empathyPhrases[i];
    }
    var found = [];
    for (var k = 0; k < empathyKeywords.length; k++) {
        var keyNorm = normalize(empathyKeywords[k]);
        if (textNormalized.indexOf(keyNorm) !== -1) found.push(empathyKeywords[k]);
    }
    return found.length >= 1 ? found.join(", ") : "";
}

function getBSDSuggestion(textNormalized) {
    var bestMatch = null;
    var maxScore = 0;

    for (var i = 0; i < bsdRules.length; i++) {
        var ruleScore = 0;
        var matchedKeys = [];

        for (var k = 0; k < bsdRules[i].keywords.length; k++) {
            var ruleKeyNorm = normalize(bsdRules[i].keywords[k]);
            if (textNormalized.indexOf(ruleKeyNorm) !== -1) {
                ruleScore++;
                matchedKeys.push(bsdRules[i].keywords[k]);
            }
        }

        if (ruleScore > maxScore) {
            maxScore = ruleScore;
            bestMatch = { rule: bsdRules[i], matchedKeys: matchedKeys };
        }
    }

    if (bestMatch && maxScore > 0) {
        return "<strong>" + bestMatch.rule.code + "</strong> — Borrower States Dissatisfaction - " + bestMatch.rule.label + 
               "<br><small style='color:#aaa;'>Match detected by: [" + bestMatch.matchedKeys.join(", ") + "]</small>";
    }

    return "<strong>BSDPAY</strong> — Borrower States Dissatisfaction - Payment Issue Resolved (Suggested by default)";
}

function analyzeRealtime(text) {
    var maskedText = maskSensitiveData(text);
    var textNormalized = normalize(maskedText);
    var score = 0;
    var foundComplaints = [];

    for (var i = 0; i < glossary.length; i++) {
        var termNorm = normalize(glossary[i]);
        if (termNorm.indexOf(" ") !== -1) {
            if (textNormalized.indexOf(termNorm) !== -1) {
                score++;
                foundComplaints.push(glossary[i]);
            }
        } else {
            var words = textNormalized.split(" ");
            for (var j = 0; j < words.length; j++) {
                if (words[j] === termNorm) {
                    if (words[j - 1] === "not" || words[j - 1] === "no") continue;
                    score++;
                    foundComplaints.push(glossary[i]);
                    break;
                }
            }
        }
    }

    var detectedEmpathy = checkEmpathy(textNormalized);
    
    var highlightedText = maskedText;
    var allTriggersToHighlight = foundComplaints.concat(
        detectedEmpathy ? detectedEmpathy.split(", ") : []
    );

    allTriggersToHighlight.sort((a, b) => b.length - a.length);

    allTriggersToHighlight.forEach(function(trigger) {
        if (trigger.trim() !== "") {
            var regex = new RegExp("(" + trigger.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", "gi");
            highlightedText = highlightedText.replace(regex, '<mark class="highlight-trigger">$1</mark>');
        }
    });

    var box = document.getElementById("transcript-box");
    box.innerHTML = highlightedText;
    box.scrollTop = box.scrollHeight;

    var result = document.getElementById("result");
    var empathyResult = document.getElementById("empathy-result");
    var bsdBox = document.getElementById("bsd-suggestion");
    var debug = document.getElementById("debug");
    var alerta = document.getElementById("alerta");

    if (score >= 1) {
        result.innerHTML = "❌ POTENTIAL COMPLAINT DETECTED (Score: " + score + ")";
        result.className = "red";
        alerta.innerHTML = "Please document your complaint in detail. For BSD Code questions, refer to Ref #4088";
        alerta.className = "red";
        
        var suggestedCode = getBSDSuggestion(textNormalized);
        bsdBox.innerHTML = "📌 Suggested BSD code: <br>" + suggestedCode;
        bsdBox.style.display = "block";
    } else if (detectedEmpathy !== "") {
        result.innerHTML = "⚠️ Evaluating Agent Response";
        result.className = "yellow";
        empathyResult.innerHTML = "Based on your response, this could potentially be considered a complaint.";
        empathyResult.className = "yellow";
        
        var suggestedCode = getBSDSuggestion(textNormalized);
        bsdBox.innerHTML = "📌 Suggested BSD code: <br>" + suggestedCode;
        bsdBox.style.display = "block";
        alerta.innerHTML = "";
    } else {
        result.innerHTML = "✅ NO COMPLAINT DETECTED";
        result.className = "green";
        alerta.innerHTML = "";
        empathyResult.innerHTML = "";
        bsdBox.style.display = "none";
    }

    debug.innerHTML = "Triggers: " + (detectedEmpathy ? "Empathy: [" + detectedEmpathy + "]" : (foundComplaints.join(", ") || "None"));
}

function resetTranscript() {
    rawTranscriptHistory = "";
    document.getElementById("transcript-box").innerHTML = "";
    document.getElementById("result").innerHTML = "";
    document.getElementById("empathy-result").innerHTML = "";
    document.getElementById("bsd-suggestion").style.display = "none";
    document.getElementById("bsd-suggestion").innerHTML = "";
    document.getElementById("alerta").innerHTML = "";
    document.getElementById("debug").innerHTML = "";
}

function toggleMonitoring() {
    if (isListening) {
        stopMonitoring();
    } else {
        startMonitoring();
    }
}

// Convertidor de Audio a PCM Linear16 de 16-bit
function convertFloat32ToInt16(buffer) {
    let l = buffer.length;
    let buf = new Int16Array(l);
    while (l--) {
        let s = Math.max(-1, Math.min(1, buffer[l]));
        buf[l] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return buf.buffer;
}

async function startMonitoring() {
    var btn = document.getElementById("btn-start");
    var status = document.getElementById("status");
    var selectedLang = document.getElementById("lang-select").value;

    try {
        status.innerText = "⏳ 1/2: Select screen/tab and enable 'Share system audio'...";
        status.style.color = "#ffd700";

        const systemStream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        const systemAudioTrack = systemStream.getAudioTracks()[0];
        if (!systemAudioTrack) {
            alert("⚠️ Important: You must check 'Share system audio' in the popup window.");
            systemStream.getTracks().forEach(t => t.stop());
            status.innerText = "⏸️ Monitoring paused.";
            return;
        }

        status.innerText = "⏳ 2/2: Requesting microphone access (Agent)...";

        const micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const sampleRate = audioContext.sampleRate;

        const merger = audioContext.createChannelMerger(2);
        const micSource = audioContext.createMediaStreamSource(micStream);
        const systemSource = audioContext.createMediaStreamSource(systemStream);

        micSource.connect(merger, 0, 0);       // Canal 0: Agente
        systemSource.connect(merger, 0, 1);    // Canal 1: Cliente

        var langCode = (selectedLang === "es") ? "es" : "en-US";
        var wsUrl = "wss://api.deepgram.com/v1/listen?encoding=linear16&sample_rate=" + sampleRate + "&channels=2&multichannel=true&language=" + langCode + "&model=nova-2";

        socket = new WebSocket(wsUrl, ["token", DEEPGRAM_API_KEY]);

        socket.onopen = function() {
            status.innerText = "🟢 Active Monitoring...";
            status.style.color = "#00e676";
            btn.innerText = "🔴 Stop Monitoring";
            isListening = true;

            // Procesador en tiempo real para convertir muestras a PCM
            processorNode = audioContext.createScriptProcessor(4096, 2, 2);
            merger.connect(processorNode);
            processorNode.connect(audioContext.destination);

            processorNode.onaudioprocess = function(e) {
                if (!isListening || socket.readyState !== 1) return;

                const left = e.inputBuffer.getChannelData(0);
                const right = e.inputBuffer.getChannelData(1);

                // Intercalar canales estéreo (Canal 0 Agente, Canal 1 Cliente)
                const interleaved = new Float32Array(left.length + right.length);
                for (let i = 0; i < left.length; i++) {
                    interleaved[i * 2] = left[i];
                    interleaved[i * 2 + 1] = right[i];
                }

                const pcmBuffer = convertFloat32ToInt16(interleaved);
                socket.send(pcmBuffer);
            };
        };

        socket.onmessage = function(msg) {
            var data = JSON.parse(msg.data);
            if (data.channel && data.channel.alternatives && data.channel.alternatives[0]) {
                var transcript = data.channel.alternatives[0].transcript;
                if (transcript && transcript.trim().length > 0) {
                    var channelIdx = (data.channel_index && data.channel_index.length > 0) ? data.channel_index[0] : 0;
                    var speaker = (channelIdx === 0) ? "Agent" : "Borrower";
                    
                    var normFragment = normalize(transcript);

                    // Auto-reset si el Agente dice una frase de opening
                    if (speaker === "Agent" && checkOpeningPhrase(normFragment)) {
                        resetTranscript();
                    }

                    rawTranscriptHistory += "[" + speaker + "]: " + transcript + "<br>";
                    analyzeRealtime(rawTranscriptHistory);
                }
            }
        };

        socket.onerror = function(err) {
            console.error("WebSocket Error:", err);
            stopMonitoring();
        };

        socket.onclose = function() {
            if (isListening) stopMonitoring();
        };

    } catch (err) {
        console.error("Error starting monitoring:", err);
        status.innerText = "❌ Error accessing audio source.";
        status.style.color = "#ff4d4d";
        isListening = false;
    }
}

function stopMonitoring() {
    var btn = document.getElementById("btn-start");
    var status = document.getElementById("status");

    if (processorNode) {
        processorNode.disconnect();
        processorNode = null;
    }
    if (socket && socket.readyState === 1) {
        socket.close();
    }
    if (audioContext) {
        audioContext.close();
    }

    isListening = false;
    status.innerText = "⏸️ Monitoring paused.";
    status.style.color = "#ffd700";
    btn.innerText = "🟢 Start Monitoring.";
}
