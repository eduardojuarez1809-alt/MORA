function normalize(text) {
    return text.toLowerCase()
        .replace(/[áàä]/g, "a")
        .replace(/[éèë]/g, "e")
        .replace(/[íìï]/g, "i")
        .replace(/[óòö]/g, "o")
        .replace(/[úùü]/g, "u")
        .replace(/['’]/g, "'")
        .replace(/[^a-z0-9' ]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function maskSensitiveData(text) {
    return text
        .replace(/\b\d{3}[-\s]?\d{2}[-\s]?\d{4}\b/g, '***-**-****')
        .replace(/(\$|usd\s?)\d+(?:,\d{3})*(?:\.\d{1,2})?/gi, '***')
        .replace(/\b\d+\b/g, '****')
        .replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\b/gi, '*')
        .replace(/\b(cero|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|diecisiete|dieciocho|diecinueve|veinte|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa)\b/gi, '*')
        .replace(/\b(hundred|thousand|million|billion|dollar|dollars|cent|cents|dolar|dolares|ciento|cientos|mil|millon|millones)\b/gi, '***');
}

        "un segundo por favor", "gracias por la espera",
        "sorry about that", "sorry for that", "disculpe por eso", "perdon por eso"
    ];

    for (var f = 0; f < falsePositiveContexts.length; f++) {
        if (textNormalized.indexOf(falsePositiveContexts[f]) !== -1) {
            return ""; 
        }
    }

    for (var i = 0; i < empathyPhrases.length; i++) {
        var termNorm = normalize(empathyPhrases[i]);
        if (textNormalized.indexOf(termNorm) !== -1) return empathyPhrases[i];
    }

    var found = [];
    for (var k = 0; k < empathyKeywords.length; k++) {
        var keyNorm = normalize(empathyKeywords[k]);
        var keywordIndex = textNormalized.indexOf(keyNorm);

        if (keywordIndex !== -1) {
            var start = Math.max(0, keywordIndex - 35);
            var end = Math.min(textNormalized.length, keywordIndex + keyNorm.length + 35);
            var snippet = textNormalized.substring(start, end);

            var isFalsePositive = falsePositiveContexts.some(function(fp) {
                return snippet.indexOf(fp) !== -1;
            });

            if (!isFalsePositive) {
                found.push(empathyKeywords[k]);
            }
        }
    }

    return found.length >= 1 ? found.join(", ") : "";
}

function getBSDSuggestion(textNormalized) {
    var ruleScores = [];

    for (var i = 0; i < bsdRules.length; i++) {
        var currentRule = bsdRules[i];
        var totalScore = 0;
        var matchedKeysMap = {};

        for (var k = 0; k < currentRule.keywords.length; k++) {
            var ruleKeyNorm = normalize(currentRule.keywords[k]);
            
            if (ruleKeyNorm.length > 0) {
                var escapedKey = ruleKeyNorm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                var regex = new RegExp("\\b" + escapedKey + "\\b", "g");
                var matches = textNormalized.match(regex);

                if (matches) {
                    totalScore += matches.length;
                    matchedKeysMap[currentRule.keywords[k]] = (matchedKeysMap[currentRule.keywords[k]] || 0) + matches.length;
                }
            }
        }

        if (totalScore > 0) {
            var matchedKeysFormatted = [];
            for (var key in matchedKeysMap) {
                matchedKeysFormatted.push(key + " (" + matchedKeysMap[key] + ")");
            }

            ruleScores.push({
                rule: currentRule,
                score: totalScore,
                matchedKeys: matchedKeysFormatted
            });
        }
    }

    ruleScores.sort(function(a, b) {
        return b.score - a.score;
    });

    if (ruleScores.length > 0) {
        var topMatch = ruleScores[0];
        var output = "<strong>" + topMatch.rule.code + "</strong> — Borrower States Dissatisfaction - " + topMatch.rule.label + 
                     "<br><small style='color:#aaa;'>Coincidencias acumuladas: [" + topMatch.matchedKeys.join(", ") + "]</small>";

        if (ruleScores.length > 1 && ruleScores[1].score > 0) {
            output += "<br><small style='color:#ffc107;'>Alternativa detectada: <strong>" + ruleScores[1].rule.code + "</strong> (" + ruleScores[1].rule.label + ")</small>";
        }

        return output;
    }

    return "<strong>BSDPAY</strong> — Borrower States Dissatisfaction - Payment Issue Resolved (Sugerido por defecto)";
}

async function startMonitoring() {
    var btn = document.getElementById("btn-start");
    var status = document.getElementById("status");
    var selectedLang = document.getElementById("lang-select").value;

    try {
        status.innerText = "⏳ Selecciona la ventana y activa 'Compartir audio del sistema'...";
        status.style.color = "#ffd700";

        const systemStream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        const systemAudioTrack = systemStream.getAudioTracks()[0];
        if (!systemAudioTrack) {
            alert("⚠️ Importante: Debes marcar la casilla 'Compartir audio del sistema' en la ventana emergente.");
            systemStream.getTracks().forEach(t => t.stop());
            status.innerText = "⏸️ Monitoreo cancelado (falta audio de sistema).";
            return;
        }

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
            await audioContext.resume();
        }

        const destination = audioContext.createMediaStreamDestination();
        const systemSource = audioContext.createMediaStreamSource(new MediaStream([systemAudioTrack]));
        systemSource.connect(destination);

        let micStream = null;
        try {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const micSource = audioContext.createMediaStreamSource(micStream);
            micSource.connect(destination);
        } catch (micErr) {
            console.warn("Micrófono no otorgado o ausente. Procesando solo audio del sistema.");
        }

        const combinedTrack = destination.stream.getAudioTracks()[0];
        mediaStream = new MediaStream([combinedTrack, systemStream.getVideoTracks()[0]]);

        const wsUrl = `wss://api.deepgram.com/v1/listen?model=nova-2&language=${selectedLang}&punctuate=true`;
        socket = new WebSocket(wsUrl, ['token', DEEPGRAM_API_KEY]);

        socket.onopen = () => {
            isListening = true;
            btn.innerText = "🛑 Stop Monitoring.";
            status.innerText = `🟢 Escuchando (${selectedLang === 'es' ? 'Español' : 'English'})...`;
            status.style.color = "#4CAF50";

            mediaRecorder = new MediaRecorder(mediaStream);
            mediaRecorder.addEventListener('dataavailable', event => {
                if (event.data.size > 0 && socket.readyState === 1) {
                    socket.send(event.data);
                }
            });
            mediaRecorder.start(250);
        };

        socket.onmessage = (message) => {
            const received = JSON.parse(message.data);
            const transcript = received.channel?.alternatives[0]?.transcript;

            if (transcript && transcript.trim().length > 0) {
                fullTranscriptHistory += " " + transcript;
                analyzeRealtime(fullTranscriptHistory);
            }
        };

        socket.onerror = (error) => {
            console.error("WebSocket Error:", error);
            status.innerText = "❌ Error de conexión con Deepgram.";
            status.style.color = "#ff4d4d";
        };

        socket.onclose = () => {
            if (isListening) stopMonitoring();
        };

        systemStream.getVideoTracks()[0].onended = () => {
            stopMonitoring();
        };

    } catch (err) {
        console.error("Error al iniciar monitoreo:", err);
        status.innerText = "⏸️ Monitoreo cancelado o permisos denegados.";
        status.style.color = "#ffd700";
    }
}

function stopMonitoring() {
    isListening = false;
    var btn = document.getElementById("btn-start");
    var status = document.getElementById("status");

    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (socket && socket.readyState === 1) socket.close();
    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
    }

    btn.innerText = "🎤 Start MORA";
    status.innerText = "⏸️ Monitoreo pausado.";
    status.style.color = "#ffd700";
}

async function handleLanguageChange() {
    if (isListening) {
        stopMonitoring();
        await startMonitoring();
    }
}

// ==========================================
// 5. ANÁLISIS EN TIEMPO REAL
// ==========================================
function analyzeRealtime(text) {
    var maskedText = maskSensitiveData(text);
    var textNormalized = normalize(maskedText);
    var score = 0;
    var foundComplaints = [];

    for (var i = 0; i < glossary.length; i++) {
        var termNorm = normalize(glossary[i]);
        if (termNorm.indexOf(" ") !== -1) {
            if (textNormalized.indexOf(termNorm) !== -1) {
                score++;
                foundComplaints.push(glossary[i]);
            }
        } else {
            var words = textNormalized.split(" ");
            for (var j = 0; j < words.length; j++) {
                if (words[j] === termNorm) {
                    if (words[j - 1] === "not" || words[j - 1] === "no") continue;
                    score++;
                    foundComplaints.push(glossary[i]);
                    break;
                }
            }
        }
    }

    var detectedEmpathy = checkEmpathy(textNormalized);
    
    var highlightedText = maskedText;
    var allTriggersToHighlight = foundComplaints.concat(
        detectedEmpathy ? detectedEmpathy.split(", ") : []
    );

    allTriggersToHighlight.sort((a, b) => b.length - a.length);

    allTriggersToHighlight.forEach(function(trigger) {
        if (trigger.trim() !== "") {
            var regex = new RegExp("(" + trigger.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ")", "gi");
            highlightedText = highlightedText.replace(regex, '<mark class="highlight-trigger">$1</mark>');
        }
    });

    var box = document.getElementById("transcript-box");
    box.innerHTML = highlightedText;
    box.scrollTop = box.scrollHeight;

    var result = document.getElementById("result");
    var empathyResult = document.getElementById("empathy-result");
    var bsdBox = document.getElementById("bsd-suggestion");
    var debug = document.getElementById("debug");
    var alerta = document.getElementById("alerta");

    if (score >= 1) {
        result.innerHTML = "❌ POTENTIAL COMPLAINT DETECTED (Score: " + score + ")";
        result.className = "red";
        alerta.innerHTML = "Please document your complaint in detail. For BSD Code questions, refer to Ref #4088";
        alerta.className = "red";
        
        var suggestedCode = getBSDSuggestion(textNormalized);
        bsdBox.innerHTML = "📌 Suggested BSD code: <br>" + suggestedCode;
        bsdBox.style.display = "block";
    } else if (detectedEmpathy !== "") {
        result.innerHTML = "⚠️ EVALUANDO RESPUESTA DEL AGENTE";
        result.className = "yellow";
        empathyResult.innerHTML = "En base a tu respuesta puede ser un posible complaint";
        empathyResult.className = "yellow";
        
        var suggestedCode = getBSDSuggestion(textNormalized);
        bsdBox.innerHTML = "📌 Suggested BSD code: <br>" + suggestedCode;
        bsdBox.style.display = "block";
        alerta.innerHTML = "";
    } else {
        result.innerHTML = "✅ NO COMPLAINT DETECTED";
        result.className = "green";
        alerta.innerHTML = "";
        empathyResult.innerHTML = "";
        bsdBox.style.display = "none";
    }

    debug.innerHTML = "Triggers: " + (detectedEmpathy ? "Empatía: [" + detectedEmpathy + "]" : (foundComplaints.join(", ") || "Ninguno"));
}

document.addEventListener("DOMContentLoaded", function() {
    var btnStart = document.getElementById("btn-start");
    var btnReset = document.getElementById("btn-reset");
    var langSelect = document.getElementById("lang-select");

    if (btnStart) btnStart.addEventListener("click", toggleMonitoring);
    if (btnReset) btnReset.addEventListener("click", resetTranscript);
    if (langSelect) langSelect.addEventListener("change", handleLanguageChange);
});
</script>
